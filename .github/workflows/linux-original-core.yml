name: Linux original core
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# Artifact policy
#   * every job succeeds  -> only two artifacts: kirikinux2-appimage, kirikinux2-deb
#   * a job fails / is cancelled / times out -> that job uploads its whole
#     workspace (<job>-workspace) for diagnosis; nothing else is uploaded.
jobs:
  components:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools and real GTK headers for component regression
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libgtk-3-dev zlib1g-dev liblz4-dev
      - run: ./scripts/linux/check-components.sh
      - name: Compile and link GTK dialogs and original drawing components
        run: |
          cmake -S tests/linux -B build-components -G Ninja -DKR2_COMPONENT_SANITIZERS=OFF
          cmake --build build-components --parallel 2
          ctest --test-dir build-components --output-on-failure
      - name: Headless plugin regressions (ncbind, psbfile.dll PSBFile.load / psb:// media)
        run: |
          cmake -S tests/plugins -B build-plugin-tests -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-plugin-tests --parallel 2 --target compat_harness psbmedia_harness psb_harness
          ctest --test-dir build-plugin-tests --output-on-failure
      - name: Upload whole workspace (failure only)
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: components-workspace
          path: ${{ github.workspace }}
          if-no-files-found: warn

  original-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop and codec development dependencies
        run: ./scripts/linux/install-deps-debian.sh
      - name: Build original core, plugins and Cocos UI resources
        run: |
          cat > "$GITHUB_WORKSPACE/blend2d-compat.h" <<'H'
          #ifndef BL_FILE64_API
          #define BL_FILE64_API(x) x
          #endif
          H
          ./scripts/linux/build.sh -DCMAKE_BUILD_TYPE=Release
        env:
          KR2_BUILD_JOBS: 2
          CXXFLAGS: "-include ${{ github.workspace }}/blend2d-compat.h"
      - name: Install assembled desktop tree
        run: cmake --install build-linux --prefix "$PWD/install-linux"
      - name: Package the original engine as AppImage
        run: |
          sudo apt-get install -y patchelf
          mkdir -p packaging-tools
          curl -fL --retry 3 https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o packaging-tools/appimagetool.AppImage
          chmod +x packaging-tools/appimagetool.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 APPIMAGETOOL="$PWD/packaging-tools/appimagetool.AppImage" ./scripts/linux/package-appimage.sh
      - name: Package the same runtime as .deb
        run: ./scripts/linux/package-deb.sh
      - name: Fetch fixed external XP3 test input
        run: |
          mkdir -p external-test
          curl -fL --retry 3 https://raw.githubusercontent.com/weimingtom/kirikiroid2_fork3/9f84364f47215ce9d352a1029879fdeca14f2653/_testdata/data.xp3 -o external-test/data.xp3
          echo '15f008b19fbd10d08002c8419670c0d7c98d03958047f2ded9dc3f1e8c58b02b  external-test/data.xp3' | sha256sum -c -
      - name: Verify the packaged AppImage with the real XP3
        run: |
          chmod 0755 dist/kirikinux2-x86_64.AppImage
          test -x dist/kirikinux2-x86_64.AppImage
          python3 scripts/linux/gui-smoke.py --engine dist/kirikinux2-x86_64.AppImage --game external-test/data.xp3 --output appimage-gui-smoke --seconds 180 --action click:10:450:235 --action focus:150 --action key:154:space --action key:158:Return --action click:162:800:650 --require-log 'Scenario loaded : ch2004.ks' --require-log 'returned to : *ch01 line offset 11' --forbid-log 'Cannot find transition handler' --forbid-log 'Cannot find transition hander'
          python3 scripts/linux/check-frame-region.py --report appimage-gui-smoke/report.json --reference frame-151.0.png --after 151 --region 160:0:1120:400 --output appimage-gui-smoke/background-region.json
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          ALSOFT_DRIVERS: "null"
      - name: Upload AppImage
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: kirikinux2-appimage
          path: dist/kirikinux2-x86_64.AppImage
          if-no-files-found: error
      - name: Upload deb
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: kirikinux2-deb
          path: dist/*.deb
          if-no-files-found: error
      - name: Upload whole workspace (failure only)
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: original-core-workspace
          path: ${{ github.workspace }}
          if-no-files-found: warn
